# /etc/nginx/sites-available/practice.betteryouhypnotherapy.co.uk.conf
# Start with this HTTP-only block, then run:
#   certbot --nginx -d practice.betteryouhypnotherapy.co.uk
# certbot adds the 443 block and the redirect. Re-check the result with `nginx -t`.
server {
    listen 80;
    listen [::]:80;
    server_name practice.betteryouhypnotherapy.co.uk;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
